[project]
name = "myLibrary"
version = "0.2.5"
description = "Study from your own PDF books: reading view with English-Chinese lookup, subject glossaries, search across your books, progress tracking and chapter notes"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Nan Li" }
]
requires-python = ">=3.14"
# What the library itself needs: reading PDFs, the reading view, adding books, OCR for scans
dependencies = [
    "cryptography>=46",  # opens copy-protected (AES-encrypted) publisher PDFs
    "onnxruntime>=1.31.1",  # runs the OCR model
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "rapidocr>=3.10.0",  # OCR for scanned books
    "reportlab>=5.1.0",  # writes the OCR text layer
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
# For the chapter scripts in the library's examples/ (checking worked examples): installed by
# `uv sync` by default; not needed just to read
science = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]
# Extra packages for one subject, installed with: uv sync --group optics
optics = [
    "optiland>=0.6.3",  # lens design: ray tracing, aberrations, optimization
    "rayoptics>=0.9.10",  # reads Zemax .zmx and CODE V .seq files
]
# The reader's browser tests (tests/browser/, in Microsoft Edge): not installed by default.
#   uv sync --group browser
#   uv run pytest tests/browser
# Exact versions are pinned in uv.lock.
browser = [
    "playwright>=1.64.1",
    "pytest-playwright>=0.10.0",
]

[tool.uv]
package = false  # the tool is a set of scripts, not an installable package
default-groups = ["dev", "science"]

[tool.ruff]
extend-exclude = ["archive"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/library_page.py" = ["E501"]  # embedded HTML/JS template
"tests/make_test_library.py" = ["E501"]  # the test corpus: its documents written out as data

[tool.pytest.ini_options]
# The tool's tests, plus the tests of your own code in the library (library/code/tests)
testpaths = ["tests", "library/code/tests"]
pythonpath = ["scripts", "library/code"]
markers = [
    "browser: a test in a real browser (tests/browser/; run with `uv run pytest tests/browser`)",
]
# A safety limit per test (not per run): a test still running after 180 s is stopped, and the
# whole test process ends with every thread's stack printed (browser tests also print where
# their own code waits, see tests/browser/conftest.py). The slowest test takes about 40 s.
faulthandler_timeout = 180
faulthandler_exit_on_timeout = true
# Every run leaves a report a failure can be read from later, whatever the command line's -r
# or output filtering: test-results/pytest-junit.xml (gitignored; the last run's), with each
# failure's node id, traceback and its captured output and log (passing tests: no output)
addopts = ["--junitxml=test-results/pytest-junit.xml"]
junit_logging = "all"
junit_log_passing_tests = false
filterwarnings = [
    # pytest-playwright 0.10's own base_url fixture (not ours); remove once it's updated
    "ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning",
]
