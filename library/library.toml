"Optical Systems and Laser Technology" = "光学系统与激光技术 Optical Systems and Laser Technology"
"Laser Material Processing Techniques" = "激光材料加工技术 Laser Material Processing Techniques"
"Weed Control and Herbicide Applications" = "杂草防治与除草剂应用 Weed Control and Herbicide Applications"
"Agricultural Engineering and Mechanization" = "农业工程与机械化 Agricultural Engineering and Mechanization"
"Smart Agriculture and AI" = "智慧农业与人工智能 Smart Agriculture and AI"
"Railway Engineering and Dynamics" = "铁路工程与动力学 Railway Engineering and Dynamics"
"Software Engineering Techniques and Practices" = "软件工程技术与实践 Software Engineering Techniques and Practices"
