# This library's settings.
name = "Nan's library"

# Shelves group the books by subject; a book can be on several (catalog.csv, column
# "shelves", or the Shelves button on the library page). Each label is shown on the
# library page: Chinese with its English translation.
[shelves]
# Shelves are made from each item's subject (OpenAlex topics, see README); here they get
# their Chinese names. Add a line for a new subject to name it in Chinese too.
